kind: pipeline
type: docker
name: default

steps:
  - name: scp
    image: appleboy/drone-scp
    settings:
      debug: true
      source:
        - ./
      host:
        from_secret: CURRENT_HOST
      username: root
      port: 22
      password:
        from_secret: SSH_PWD
      target: /data/app/send

  - name: deploy
    image: appleboy/drone-ssh
    settings:
      host:
        from_secret: CURRENT_HOST
      username: root
      password:
        from_secret: SSH_PWD
      port: 22
      command_timeout: 5m
      script:
        - cd /data/app/send
        - npm config set registry https://registry.npmmirror.com/
        - npm ci
        # 契约链路自检：schema→openapi→客户端，与提交不一致即失败
        - npm run codegen
        - git diff --exit-code openapi.json app/api/generated
        - npm run typecheck
        - npm run build
        # 密钥经环境文件注入（不再落 config.json 到构建产物）
        - mc cp local/config/send/env /data/app/send/.env.production
        - docker stop send || true
        - docker rm send || true
        - docker-compose up -d
        - docker-compose logs
