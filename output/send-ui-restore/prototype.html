<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SEND 原版 UI 复原 · 高保真原型</title>
<style>
/* ============ Token 层（数值来源见 DESIGN.md §4.0） ============ */
:root{
  --send-primary:#1677ff; --send-link:#11b5f1; --send-focus:#409eff;
  --send-panel:#ECECEC; --send-card:#fff;
  --send-muted:rgba(0,0,0,.5); --send-muted2:#AAA; --send-label:#505050;
  --send-border:#DDD; --send-input-border:#dcdfe6; --send-expand-border:#CCC;
  --send-shadow:0 0 8px rgba(0,0,0,.25);
  --send-pill:1000px; --send-radius-card:8px;
  --send-radius-bubble:20px 4px 20px 20px;
  --send-header-bg:rgba(0,0,0,.12);
  --send-font:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,"Segoe UI",Arial,Roboto,"PingFang SC","Microsoft Yahei",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
ul{list-style:none}
button{font-family:inherit;cursor:pointer;border:0;background:none}
input,textarea{font-family:inherit}
body{font-family:var(--send-font);font-size:14px;color:#222;background:#1c2431;min-height:100vh}

/* ============ 演示外壳（非产品 UI） ============ */
.demo-bar{position:sticky;top:0;z-index:99;display:flex;gap:8px;align-items:center;
  padding:10px 16px;background:#10151f;color:#9fb0c8;font-size:13px;flex-wrap:wrap}
.demo-bar b{color:#e6edf7}
.demo-btn{padding:6px 14px;border-radius:8px;background:#232c3b;color:#cdd8e8;font-size:13px}
.demo-btn.on{background:var(--send-primary);color:#fff}
.demo-sep{width:1px;height:18px;background:#33405540;margin:0 6px}
.shell-wrap{display:flex;justify-content:center;padding:18px}
.shell{container-type:inline-size;width:1280px;flex:none;transition:width .25s ease}

/* ============ 页面骨架 ============ */
.app{position:relative;height:860px;max-height:calc(100vh - 90px);display:flex;flex-direction:column;overflow:hidden;border-radius:14px;background:#8ecdf0}
.bg{position:absolute;inset:0;width:100%;height:100%;z-index:0;filter:blur(1px) saturate(1.15);opacity:.97}
.app>*{position:relative;z-index:1}
.app>.bg,.app>.petals{position:absolute;z-index:0}

/* 云与方块动效 */
@keyframes cloud-sway{from{transform:translateX(-14px)}to{transform:translateX(18px)}}
@keyframes px-drift{from{transform:translateX(1280px)}to{transform:translateX(-360px)}}
@keyframes bob{from{transform:translateY(-8px)}to{transform:translateY(9px)}}
@keyframes twinkle{0%,100%{opacity:.15}50%{opacity:.95}}
.cloud{animation:cloud-sway 9s ease-in-out infinite alternate}
.cloud.c2{animation-duration:13s;animation-delay:-4s}
.cloud.c3{animation-duration:16s;animation-delay:-8s}
.pxcloud{animation:px-drift 70s linear infinite}
.pxcloud.p2{animation-duration:95s;animation-delay:-40s}
.block{animation:bob 5.5s ease-in-out infinite alternate}
.block.b2{animation-delay:-2.2s}.block.b3{animation-delay:-3.8s}
.spark{animation:twinkle 3.2s ease-in-out infinite}
.spark.s2{animation-delay:-1.1s}.spark.s3{animation-delay:-2.3s}

/* 樱花飘落 */
.petals{position:absolute;inset:0;overflow:hidden;z-index:0;pointer-events:none}
.petals i{position:absolute;top:-26px;width:15px;height:11px;opacity:.92;
  background:linear-gradient(120deg,#ffd3e4,#ff9cc6);border-radius:60% 40% 55% 45%/55% 60% 40% 45%;
  box-shadow:0 1px 3px rgba(255,143,191,.45);animation:fall linear infinite}
@keyframes fall{0%{transform:translate(0,-20px) rotate(0)}25%{transform:translate(26px,220px) rotate(140deg)}
  50%{transform:translate(-14px,450px) rotate(280deg)}75%{transform:translate(30px,680px) rotate(420deg)}
  100%{transform:translate(6px,920px) rotate(560deg)}}
@media (prefers-reduced-motion:reduce){.cloud,.pxcloud,.block,.spark,.petals i{animation:none!important}}
.header{height:50px;flex:none;display:flex;align-items:center;justify-content:space-between;
  background:var(--send-header-bg);box-shadow:0 0 1px rgba(0,0,0,.05)}
.logo{margin-left:20px;color:#fff;font-size:20px;font-weight:700;cursor:pointer;
  text-shadow:rgba(0,0,0,.39) 1px 0 0, rgba(0,0,0,.39) 0 1px 0, rgba(0,0,0,.39) -1px 0 0, rgba(0,0,0,.39) 0 -1px 0}
.footer{flex:none;height:30px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px}
.main{flex:1;display:flex;flex-direction:column;min-height:0}

/* ============ 通用控件 ============ */
.pill{display:block;width:200px;height:48px;border-radius:var(--send-pill);font-size:18px;
  box-shadow:var(--send-shadow);position:relative}
.pill:active{filter:brightness(.9)}
.pill-primary{background:var(--send-primary);color:#fff}
.pill-default{background:#fff;color:#262626}
.pill:focus-visible{outline:2px solid var(--send-primary);outline-offset:2px}
.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%) translateY(-12px);z-index:200;
  background:#fff;color:#333;font-size:14px;padding:9px 18px;border-radius:8px;box-shadow:0 2px 14px rgba(0,0,0,.25);
  opacity:0;pointer-events:none;transition:.18s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ============ 入口页 ============ */
.entry{flex:1;display:flex;justify-content:center;align-items:center;min-height:0}
.entry-inner{display:flex;align-items:center;margin-top:-10%}
.entry-left{width:200px;display:flex;flex-direction:column;justify-content:space-around}
.receive-box{position:relative;margin-top:80px}
.receive-input{position:absolute;right:0;top:0;width:0;height:100%;overflow:hidden;
  border:4px solid var(--send-expand-border);border-radius:var(--send-pill);background:#fff;
  padding:0 8px 0 18px;opacity:0;transition:width .1s linear;display:flex;align-items:center}
.receive-box.open .receive-input{width:100%;opacity:1}
.receive-box.open .pill{visibility:hidden}
.receive-input input{width:100%;border:0;outline:0;font-size:16px;height:100%;background:transparent}
.entry-right{margin-left:200px;width:700px;height:400px;border-radius:2px;
  box-shadow:var(--send-shadow);position:relative;overflow:hidden;
  background:linear-gradient(160deg,#14263d 0%,#0a1626 100%)}
.entry-right video{width:100%;height:100%;object-fit:cover}
@container (max-width:920px){
  .entry-right{display:none}
  .entry-inner{margin-top:0}
}

/* ============ 房间页 ============ */
.room{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
.room-cols{display:flex;align-items:flex-start}
.list{background:var(--send-panel);width:700px;height:600px;border-radius:var(--send-radius-card);
  display:flex;flex-direction:column;position:relative;overflow:hidden}
.nav{flex:none;height:40px;line-height:40px;text-align:center;font-size:20px;border-bottom:1px solid var(--send-border);position:relative}
.nav .id{color:#666;font-size:14px;margin-right:6px}
.nav .peer{position:absolute;right:12px;top:8px;font-size:12px;color:#8a94a0;background:#fff;border-radius:10px;padding:2px 8px}
.msgs{flex:1;overflow-y:auto;padding:10px 0 70px}
.msg{margin-bottom:20px;width:100%}
.msg .time{font-size:12px;color:var(--send-muted);text-align:end;padding-right:16px;margin-bottom:4px}
.msg .row{display:flex;align-items:center;justify-content:flex-end;margin-right:8px}
.bubble{background:var(--send-card);border-radius:var(--send-radius-bubble);padding:5px 12px;line-height:1.7;
  max-width:80%;position:relative;white-space:pre-wrap;word-break:break-word;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.bubble a{color:var(--send-link);text-decoration:none}
.bubble a:hover{text-decoration:underline}
.bubble a.file,.bubble a.file .fname{color:#222;text-decoration:none}
.copy-chip{position:absolute;left:-24px;top:50%;transform:translateY(-50%);background:#fff;padding:2px;border-radius:10px;
  box-shadow:0 1px 4px rgba(0,0,0,.2);display:none;cursor:pointer}
.msg:hover .copy-chip, .copy-chip:focus-visible{display:block}
.copy-chip svg{display:block;width:16px;height:16px}
.file{display:inline-block;min-width:200px;padding-right:54px;position:relative;color:#222;text-decoration:none}
.file .fname{display:inline-block;white-space:pre-wrap;max-width:80%;vertical-align:top}
.file .fsize{color:var(--send-muted2);font-size:12px;display:block}
.file .ficon{position:absolute;right:0;top:2px;width:36px}
.file .ficon svg{width:36px;height:44px}
.img-in{max-width:350px;max-height:400px;display:block;cursor:zoom-in}
.status-ring{width:32px;height:32px;margin-left:8px;flex:none}
.empty{color:var(--send-muted);text-align:center;padding-top:40px}
.inputbar{position:absolute;bottom:0;left:0;width:100%;height:60px;background:#fff;display:flex;justify-content:flex-end;align-items:center}
.inputbar textarea{width:100%;height:100%;border:0;outline:0;resize:none;font-size:20px;padding:6px 16px 0}
.plus{font-size:40px;line-height:60px;margin-right:16px;color:#333;flex:none}
.send-btn{margin-right:12px;height:36px;padding:0 18px;border-radius:var(--send-pill);background:var(--send-primary);color:#fff;font-size:15px;display:none;flex:none}
.send-btn.show{display:block}
.share{background:#fff;width:300px;height:600px;border-radius:var(--send-radius-card);margin-left:180px;
  padding:8px 0 20px;overflow-y:auto}
.share h3{font-size:24px;margin:8px 0 20px 32px;font-weight:700}
.qr{display:block;margin:0 auto;width:264px;height:264px;background:#fff}
.share .scan{margin:8px 0 14px 32px;color:#666}
.copy-row{margin:0 0 20px 37px}
.copy-row .lab{font-size:16px;color:var(--send-label);margin-bottom:4px}
.copy-row .line{display:flex;align-items:center}
.copy-row input{width:180px;height:30px;border:1px solid var(--send-input-border);border-radius:4px;padding:0 8px;font-size:12px;outline:0}
.copy-row input:focus{border-color:var(--send-focus);transition:border-color .2s}
.copy-ico{width:30px;height:30px;border-radius:8px;margin-left:16px;display:inline-flex;align-items:center;justify-content:center;color:#555}
.copy-ico:hover{background:rgba(22,119,255,.8);color:#fff}
.copy-ico svg{width:16px;height:16px}
.drag-tip{display:none;position:absolute;inset:0;background:rgba(123,121,121,.2);border:1px dashed #000;border-radius:10px;z-index:5}
.drag-tip b{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:20px;font-weight:600;color:#111}
.list.dragover .drag-tip{display:block}
@container (max-width:1290px){ .share{margin-left:80px} }
@container (max-width:920px){
  .room{align-items:stretch}
  .share{display:none}
  .list{width:100%;height:100%;border-radius:0}
  .nav .share-open{position:absolute;left:12px;top:8px;font-size:13px;color:var(--send-primary);background:none}
}
.nav .share-open{display:none}
@container (max-width:920px){ .nav .share-open{display:block} }

/* 分享弹层（移动端） */
.sheet-mask{display:none;position:absolute;inset:0;background:rgba(0,0,0,.45);z-index:20}
.sheet-mask.open{display:block}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:14px 14px 0 0;max-height:78%;overflow-y:auto;padding:10px 0 24px}
.sheet h3{font-size:20px;margin:6px 0 16px 24px}
.sheet .copy-row{margin-left:24px}
.sheet .close{position:absolute;right:16px;top:10px;font-size:20px;color:#888;padding:6px}

/* ============ 数据页 ============ */
.data{flex:1;overflow-y:auto;padding:26px;display:flex;gap:20px;align-items:flex-start}
.data .card{background:#fff;border-radius:var(--send-radius-card);box-shadow:var(--send-shadow);padding:20px;flex:1;min-width:0}
.data h3{font-size:16px;color:#666;margin-bottom:14px}
.data .chips{display:flex;flex-wrap:wrap;gap:10px}
.data .chip{background:var(--send-panel);border-radius:6px;padding:8px 14px;font-size:14px}
.data a.chip{color:var(--send-primary);text-decoration:none}
.data a.chip:hover{background:#e3efff}
@container (max-width:920px){ .data{flex-direction:column} .data .card{flex:none;width:100%} }

/* ============ 滚动条与精细化 ============ */
.msgs,.share,.sheet,.data{scrollbar-width:thin;scrollbar-color:rgba(0,0,0,.22) transparent}
.msgs::-webkit-scrollbar,.share::-webkit-scrollbar,.sheet::-webkit-scrollbar,.data::-webkit-scrollbar{width:8px;height:8px}
.msgs::-webkit-scrollbar-track,.share::-webkit-scrollbar-track,.sheet::-webkit-scrollbar-track,.data::-webkit-scrollbar-track{background:transparent}
.msgs::-webkit-scrollbar-thumb,.share::-webkit-scrollbar-thumb,.sheet::-webkit-scrollbar-thumb,.data::-webkit-scrollbar-thumb{
  background:rgba(0,0,0,.18);border-radius:8px;border:2px solid transparent;background-clip:padding-box}
.msgs::-webkit-scrollbar-thumb:hover,.share::-webkit-scrollbar-thumb:hover,.sheet::-webkit-scrollbar-thumb:hover,.data::-webkit-scrollbar-thumb:hover{background-color:rgba(0,0,0,.32)}
.msgs{overscroll-behavior:contain}
::selection{background:#cfe3ff}
.pill{transition:filter .15s ease}
.pill:hover{filter:brightness(.96)}
.pill:active{filter:brightness(.9)}
.plus{border-radius:10px;transition:background .15s}
.plus:hover{background:#f0f4f8}
.send-btn{transition:filter .15s}
.send-btn:hover{filter:brightness(.95)}
.copy-chip{transition:background .15s,transform .15s}
.copy-chip:hover{background:#f2f8ff;transform:translateY(-50%) scale(1.08)}
.copy-ico{transition:background .15s,color .15s}
.bubble{box-shadow:0 1px 3px rgba(0,0,0,.08)}
.sheet-mask{backdrop-filter:blur(3px)}
textarea:focus-visible,input:focus-visible{outline:2px solid rgba(22,119,255,.4);outline-offset:1px;border-radius:4px}
@keyframes msg-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.msg{animation:msg-in .18s ease-out}
.empty{display:flex;flex-direction:column;align-items:center;gap:10px}
.empty svg{opacity:.45}

/* ============ 演示舞台动画（代替 example.mp4） ============ */
.stage{display:block;width:100%;height:100%}
@keyframes fly-x{0%,6%{transform:translateX(0)}52%,100%{transform:translateX(340px)}}
@keyframes fly-y{0%,6%{transform:translateY(0)}28%{transform:translateY(-82px)}52%,100%{transform:translateY(0)}}
@keyframes fly-spin{0%,6%{transform:rotate(-8deg)}52%,100%{transform:rotate(306deg)}}
@keyframes send-ring{0%,6%{stroke-dashoffset:88}52%{stroke-dashoffset:0}60%,100%{stroke-dashoffset:0}}
@keyframes send-check{0%,55%{opacity:0}60%,92%{opacity:1}100%{opacity:0}}
@keyframes pop-in{0%,52%{transform:scale(0);opacity:0}60%{transform:scale(1.18);opacity:1}
  68%{transform:scale(.94)}74%,92%{transform:scale(1);opacity:1}100%{transform:scale(1);opacity:0}}
@keyframes thanks{0%,64%{opacity:0;transform:translateY(8px) scale(.7)}72%,90%{opacity:1;transform:none}100%{opacity:0}}
@keyframes scrub{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes live{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes twk{0%,100%{opacity:.15}50%{opacity:1}}
.fx{animation:fly-x 6s cubic-bezier(.42,0,.58,1) infinite}
.fy{animation:fly-y 6s cubic-bezier(.42,0,.58,1) infinite}
.fs{animation:fly-spin 6s cubic-bezier(.42,0,.58,1) infinite;transform-box:fill-box;transform-origin:center}
.ring{stroke-dasharray:88;animation:send-ring 6s linear infinite}
.chk{animation:send-check 6s linear infinite}
.pop{animation:pop-in 6s cubic-bezier(.2,1.3,.4,1) infinite;transform-box:fill-box;transform-origin:center}
.thx{animation:thanks 6s ease-out infinite}
.scrub{transform-origin:left center;animation:scrub 6s linear infinite}
.live-dot{animation:live 1.2s ease-in-out infinite}
.twk{animation:twk 1.6s ease-in-out infinite}
.twk.t2{animation-delay:-.8s}
@media (prefers-reduced-motion:reduce){
  .fx,.fy,.fs,.ring,.chk,.pop,.thx,.scrub,.live-dot,.twk{animation:none!important}
  .chk,.pop,.thx{opacity:1}
}

/* 大图预览 */
.viewer{display:none;position:absolute;inset:0;background:rgba(0,0,0,.92);z-index:30;align-items:center;justify-content:center}
.viewer.open{display:flex}
.viewer img{max-width:92%;max-height:88%}
.viewer .x{position:absolute;top:14px;right:18px;color:#fff;font-size:26px}
</style>
</head>
<body>

<div class="demo-bar">
  <b>SEND 原版 UI 复原原型</b>
  <span class="demo-sep"></span>
  <button class="demo-btn on" data-page="entry">入口页</button>
  <button class="demo-btn" data-page="room">房间页</button>
  <button class="demo-btn" data-page="data">数据页</button>
  <span class="demo-sep"></span>
  <button class="demo-btn on" data-w="1280">桌面 1280</button>
  <button class="demo-btn" data-w="1100">平板 1100</button>
  <button class="demo-btn" data-w="390">手机 390</button>
  <span class="demo-sep"></span>
  <button class="demo-btn" id="demo-upload">▶ 演示：文件上传流转</button>
  <button class="demo-btn" id="demo-fail">▶ 演示：发送失败/重发</button>
  <button class="demo-btn" id="demo-drag">▶ 演示：拖拽遮罩</button>
</div>

<div class="shell-wrap"><div class="shell" id="shell"><div class="app">
  <svg class="bg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#3d8fd9"/><stop offset=".34" stop-color="#79c3ee"/>
        <stop offset=".58" stop-color="#c6e8fa"/><stop offset=".74" stop-color="#ffeccb"/>
        <stop offset="1" stop-color="#d9f0c0"/>
      </linearGradient>
      <linearGradient id="hillA" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#93c878"/><stop offset="1" stop-color="#6ba254"/>
      </linearGradient>
      <linearGradient id="hillB" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#7fb45f"/><stop offset="1" stop-color="#5c8f47"/>
      </linearGradient>
      <radialGradient id="sun" cx=".5" cy=".5" r=".5">
        <stop offset="0" stop-color="#fffbe8"/><stop offset=".5" stop-color="#fff3c4" stop-opacity=".8"/>
        <stop offset="1" stop-color="#fff3c4" stop-opacity="0"/>
      </radialGradient>
      <g id="cumulus">
        <circle cx="-62" cy="8" r="34" fill="#fff"/><circle cx="0" cy="-16" r="48" fill="#fff"/>
        <circle cx="62" cy="6" r="36" fill="#fff"/><circle cx="24" cy="10" r="34" fill="#fff"/>
        <ellipse cx="0" cy="26" rx="96" ry="22" fill="#fff"/>
        <ellipse cx="0" cy="34" rx="88" ry="14" fill="#e3f0fb"/>
      </g>
      <g id="pxcloud" fill="#fff" opacity=".95">
        <rect x="16" y="0" width="16" height="16"/><rect x="32" y="0" width="16" height="16"/><rect x="48" y="16" width="16" height="16"/>
        <rect x="0" y="16" width="16" height="16"/><rect x="16" y="16" width="16" height="16"/><rect x="32" y="16" width="16" height="16"/>
        <rect x="64" y="16" width="16" height="16"/><rect x="48" y="32" width="16" height="16"/><rect x="64" y="32" width="16" height="16"/>
        <rect x="80" y="32" width="16" height="16"/><rect x="32" y="32" width="16" height="16"/>
      </g>
      <g id="grassblock">
        <rect x="0" y="16" width="110" height="52" fill="#b2875a"/>
        <rect x="0" y="16" width="110" height="16" fill="#7fbf5f"/>
        <rect x="0" y="32" width="10" height="8" fill="#7fbf5f" opacity=".7"/>
        <rect x="86" y="36" width="12" height="8" fill="#7fbf5f" opacity=".7"/>
        <rect x="18" y="44" width="10" height="10" fill="#9a7148"/><rect x="60" y="50" width="14" height="10" fill="#9a7148"/>
        <rect x="0" y="68" width="110" height="6" fill="#5f8a45" opacity=".55"/>
        <rect x="14" y="8" width="16" height="8" fill="#7fbf5f"/><rect x="46" y="4" width="20" height="12" fill="#7fbf5f"/><rect x="78" y="9" width="14" height="7" fill="#7fbf5f"/>
      </g>
      <g id="sparkle" fill="#fff">
        <path d="M0 -10 L2.2 -2.2 L10 0 L2.2 2.2 L0 10 L-2.2 2.2 L-10 0 L-2.2 -2.2 Z"/>
      </g>
    </defs>
    <rect width="1200" height="800" fill="url(#sky)"/>
    <circle cx="950" cy="90" r="150" fill="url(#sun)"/>
    <path d="M0 520 L150 430 L320 515 L500 425 L690 520 L860 455 L1030 530 L1200 470 V800 H0 Z" fill="#a9d3ea" opacity=".8"/>
    <path d="M0 585 L210 495 L430 580 L660 505 L900 595 L1200 540 V800 H0 Z" fill="#bfe0c8" opacity=".85"/>
    <g class="cloud c1"><use href="#cumulus" transform="translate(230 150) scale(1.15)"/></g>
    <g class="cloud c2"><use href="#cumulus" transform="translate(760 90) scale(.8)"/></g>
    <g class="cloud c3"><use href="#cumulus" transform="translate(1050 260) scale(.6)"/></g>
    <g class="pxcloud p1"><use href="#pxcloud" transform="translate(0 120) scale(1.1)"/></g>
    <g class="pxcloud p2"><use href="#pxcloud" transform="translate(0 300) scale(.8)"/></g>

<script>
/* ================= 演示控制 ================= */
const $=s=>document.querySelector(s);
const pages={entry:$('#page-entry'),room:$('#page-room'),data:$('#page-data')};
let cur='entry';
function go(p){cur=p;for(const k in pages)pages[k].style.display=k===p?'flex':'none';
  document.querySelectorAll('.demo-btn[data-page]').forEach(b=>b.classList.toggle('on',b.dataset.page===p));
  if(p==='room')renderMsgs();}
document.querySelectorAll('.demo-btn[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));
$('#logo').onclick=()=>go('entry');
document.querySelectorAll('.demo-btn[data-w]').forEach(b=>b.onclick=()=>{
  $('#shell').style.width=b.dataset.w+'px';
  document.querySelectorAll('.demo-btn[data-w]').forEach(x=>x.classList.toggle('on',x===b));});

let toastTimer;
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),1800);}

/* ================= 入口页 ================= */
$('#btn-create').onclick=()=>{toast('已创建房间 6010（模拟服务端回执）');go('room');};
$('#btn-join').onclick=()=>{$('#receive-box').classList.add('open');setTimeout(()=>$('#code-input').focus(),120);};
$('#code-input').addEventListener('input',e=>{
  const v=e.target.value.replace(/\D/g,'').slice(0,4);e.target.value=v;
  if(v.length===4)setTimeout(()=>{toast('跳转 /room/'+v);closeJoin();go('room');},200);});
$('#code-input').addEventListener('blur',()=>setTimeout(closeJoin,150));
function closeJoin(){$('#receive-box').classList.remove('open');$('#code-input').value='';}

/* ================= 房间页：消息 ================= */
const ICON_COPY='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>';
const FILE_SVG='<svg viewBox="0 0 36 44"><path d="M2 4a3 3 0 0 1 3-3h18l11 11v29a3 3 0 0 1-3 3H5a3 3 0 0 1-3-3z" fill="#cfd8e3"/><path d="M23 1l11 11H26a3 3 0 0 1-3-3z" fill="#aebccf"/><rect x="9" y="24" width="18" height="4" rx="2" fill="#8fa3bd"/><rect x="9" y="31" width="12" height="4" rx="2" fill="#8fa3bd"/></svg>';
let msgs=[
  {id:'m1',type:'text',text:'你好，这个房间用来传文件',time:fmt(-32),status:'resolved'},
  {id:'m2',type:'text',text:'https://www.bilibili.com/video/BV1xx411c7mD',time:fmt(-28),status:'resolved'},
  {id:'m3',type:'file',file:{name:'季度报告-终版-最终版(1).pdf',size:24117248},url:'#',time:fmt(-9),status:'resolved'},
  {id:'m4',type:'file',img:true,file:{name:'截图.png',size:352000},url:'#',time:fmt(-4),status:'resolved'},
];
function fmt(min){const d=new Date(Date.now()+min*60000);return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日'+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function sizeText(b){const u=['B','KB','MB','GB'];let v=b,i=0;while(v>=1024&&i<3){v/=1024;i++}return (i?v.toFixed(1):Math.round(v))+u[i];}
function ring(percent,status){
  if(status==='resolved')return '';
  const c=2*Math.PI*13;
  if(status==='uploading'||status==='sending'){
    const off=c*(1-(status==='sending'?1:percent)/100);
    const cls=status==='sending'?'spin':'';
    return '<svg class="status-ring '+cls+'" viewBox="0 0 32 32"><circle cx="16" cy="16" r="13" stroke="#d9d9d9" stroke-width="3" fill="none"/>'+
      (status==='uploading'?'<circle cx="16" cy="16" r="13" stroke="#1677ff" stroke-width="3" fill="none" stroke-dasharray="'+c+'" stroke-dashoffset="'+off+'" transform="rotate(-90 16 16)"/>':'<circle cx="16" cy="16" r="13" stroke="#1677ff" stroke-width="3" fill="none" stroke-dasharray="'+(c*.25)+' '+c+'"/>')+
      (status==='uploading'?'<text x="16" y="19" font-size="9" text-anchor="middle" fill="#666">'+percent+'</text>':'')+'</svg>';
  }
  return '<svg class="status-ring" viewBox="0 0 32 32"><circle cx="16" cy="16" r="13" stroke="#e5484d" stroke-width="3" fill="none"/><path d="M11 11l10 10M21 11l-10 10" stroke="#e5484d" stroke-width="3" stroke-linecap="round"/></svg>';
}
function bodyOf(m){
  if(m.type==='text'){
    return /^https?:/.test(m.text)?'<a href="'+m.text+'" target="_blank">'+m.text+'</a>':m.text;
  }
  if(m.img){
    return '<img class="img-in" src="'+placeholderImg(m.file.name)+'" data-full="'+placeholderImg(m.file.name)+'" alt="'+m.file.name+'">';
  }
  return '<a class="file" href="'+(m.url||'#')+'" target="_blank"><span class="fname">'+m.file.name+'</span><span class="fsize">'+sizeText(m.file.size)+'</span><span class="ficon">'+FILE_SVG+'</span></a>';
}
function renderMsgs(){
  const box=$('#msgs');
  if(!msgs.length){box.innerHTML='<div class="empty"><svg width="56" height="56" viewBox="0 0 56 56" fill="none" aria-hidden="true">'+
    '<path d="M6 12h26v18H20l-8 7v-7H6z" fill="#fff" stroke="#b8c6d4" stroke-width="2.5" stroke-linejoin="round"/>'+
    '<rect x="26" y="6" width="22" height="12" fill="#7fbf5f"/><rect x="26" y="18" width="22" height="12" fill="#b2875a"/>'+
    '<rect x="30" y="22" width="4" height="4" fill="#9a7148"/><rect x="40" y="24" width="4" height="4" fill="#9a7148"/>'+
    '<circle cx="14" cy="21" r="1.8" fill="#8fa3bd"/><circle cx="20" cy="21" r="1.8" fill="#8fa3bd"/></svg>暂无分享</div>';return;}
  box.innerHTML=msgs.map(m=>
    '<div class="msg" data-id="'+m.id+'"><div class="time">'+m.time+'</div><div class="row">'+
    '<div class="bubble">'+bodyOf(m)+
      (m.status==='resolved'?'<button class="copy-chip" title="复制" data-copy="'+(m.type==='file'?m.file.name:m.text)+'">'+ICON_COPY+'</button>':'')+
    '</div>'+ring(m.percent||0,m.status)+'</div></div>').join('');
  box.scrollTop=box.scrollHeight;
  box.querySelectorAll('.copy-chip').forEach(c=>c.onclick=()=>toast('复制成功'));
  box.querySelectorAll('.img-in').forEach(im=>im.onclick=()=>{$('#viewer-img').src=im.dataset.full;$('#viewer').classList.add('open');});
  box.querySelectorAll('[data-retry]').forEach(b=>b.onclick=()=>{
    const m=msgs.find(x=>x.id===b.dataset.retry);m.status='sending';renderMsgs();
    setTimeout(()=>{m.status='resolved';renderMsgs();toast('重发成功');},900);});
}
function placeholderImg(name){
  const c=document.createElement('canvas');c.width=320;c.height=200;const g=c.getContext('2d');
  const grd=g.createLinearGradient(0,0,320,200);grd.addColorStop(0,'#7ec3f0');grd.addColorStop(1,'#a4cc84');
  g.fillStyle=grd;g.fillRect(0,0,320,200);g.fillStyle='rgba(255,255,255,.85)';g.font='16px sans-serif';g.fillText(name.slice(0,24),16,100);
  return c.toDataURL();
}
/* 发送 */
const ta=$('#ta');
ta.addEventListener('input',()=>$('#send').classList.toggle('show',ta.value.trim().length>0));
ta.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing&&e.keyCode!==229){e.preventDefault();send();}});
$('#send').onclick=send;
$('#plus').onclick=()=>{demoUpload();};
function send(){
  const t=ta.value.trim();if(!t)return;ta.value='';$('#send').classList.remove('show');
  const m={id:'n'+Date.now(),type:'text',text:t,time:fmt(0),status:'sending'};
  msgs.push(m);renderMsgs();
  setTimeout(()=>{m.status='resolved';renderMsgs();},600);
}
/* 上传流转演示 */
function demoUpload(){
  const m={id:'u'+Date.now(),type:'file',file:{name:'演示附件.zip',size:8388608},url:'#',time:fmt(0),status:'uploading',percent:0};
  msgs.push(m);renderMsgs();
  let p=0;const t=setInterval(()=>{p+=17;if(p>=100){p=100;clearInterval(t);m.percent=100;m.status='sending';renderMsgs();
    setTimeout(()=>{m.status='resolved';renderMsgs();},700);}else{m.percent=p;renderMsgs();}},180);
}
$('#demo-upload').onclick=()=>{go('room');demoUpload();};
$('#demo-fail').onclick=()=>{go('room');
  const m={id:'f'+Date.now(),type:'text',text:'这条会失败（演示）',time:fmt(0),status:'rejected'};
  msgs.push(m);renderMsgs();
  const el=document.querySelector('.msg[data-id="'+m.id+'"] .row');
  el.insertAdjacentHTML('beforeend','<button class="send-btn show" style="display:block" data-retry="'+m.id+'">重发</button>');
  el.querySelector('[data-retry]').onclick=()=>{m.status='sending';renderMsgs();
    setTimeout(()=>{m.status='resolved';renderMsgs();toast('重发成功');},900);};};
$('#demo-drag').onclick=e=>{go('room');const l=$('#list');const on=!l.classList.contains('dragover');l.classList.toggle('dragover',on);e.target.classList.toggle('on',on);};
/* 分享弹层 & 复制 */
$('#share-open').onclick=()=>$('#sheet-mask').classList.add('open');
$('#sheet-close').onclick=()=>$('#sheet-mask').classList.remove('open');
document.querySelectorAll('.copy-ico').forEach(b=>b.onclick=()=>toast(b.dataset.copy+'已复制'));
$('#viewer-x').onclick=()=>$('#viewer').classList.remove('open');
$('#viewer').onclick=e=>{if(e.target.id==='viewer')$('#viewer').classList.remove('open');};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('#viewer').classList.remove('open');$('#sheet-mask').classList.remove('open');}});

/* 伪二维码（确定性图案，仅视觉占位） */
function drawQr(id){const cv=document.getElementById(id);if(!cv)return;const g=cv.getContext('2d');const n=29,s=cv.width/n;
  g.fillStyle='#fff';g.fillRect(0,0,cv.width,cv.height);g.fillStyle='#000';
  let seed=6010;const rnd=()=>((seed=(seed*9301+49297)%233280)/233280);
  for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(rnd()>.52)g.fillRect(x*s,y*s,s,s);
  const finder=(fx,fy)=>{g.fillStyle='#fff';g.fillRect((fx-1)*s,(fy-1)*s,9*s,9*s);g.fillStyle='#000';
    g.fillRect(fx*s,fy*s,7*s,7*s);g.fillStyle='#fff';g.fillRect((fx+1)*s,(fy+1)*s,5*s,5*s);g.fillStyle='#000';g.fillRect((fx+2)*s,(fy+2)*s,3*s,3*s);};
  finder(2,2);finder(n-9,2);finder(2,n-9);}
drawQr('qr1');drawQr('qr2');
renderMsgs();
